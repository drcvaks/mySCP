<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challah Part 1 Import Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#172033;font:15px/1.6 Arial,sans-serif;letter-spacing:0}
header{padding:20px 28px;border-bottom:1px solid #d9e1e6;background:white}h1{font-size:24px;margin:0}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 10px}
button,input{font:inherit}button{cursor:pointer;border:1px solid #d7dfe5;border-radius:4px;background:white;color:#172033;padding:8px 12px}button:disabled{opacity:.4;cursor:default}button.active{background:#172033;color:white;border-color:#172033}button:focus-visible,a:focus-visible{outline:3px solid #3f947b;outline-offset:2px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{font-size:12px;background:#e8f4ec;padding:3px 10px;border-radius:4px}.local{background:#fff1c4}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.workspace{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;max-width:1320px;padding:24px;margin:auto}
aside{min-width:0}input{width:100%;padding:10px;border:1px solid #d7dfe5;border-radius:4px}.sections{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}.sections button{padding:5px 10px}.list{max-height:70vh;overflow:auto}.chunk{width:100%;text-align:left;border:0;border-left:3px solid transparent;border-radius:0;margin-bottom:4px;padding:10px;background:transparent;display:block}.chunk.selected{background:#e8f4ec;border-left-color:#15803d}.chunk strong{display:block;font-size:14px}.meta{font-size:12px;color:#58697b}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
main{min-width:0}.paper-scroll{height:70vh;overflow:auto;background:#e9eef1;border:1px solid #d9e1e6;padding:16px}.paper{max-width:850px;background:white;margin:0 auto 20px;padding:32px;min-width:0}.paragraph{margin:0 0 15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.8;direction:ltr}.heading{font-size:18px;font-weight:bold;margin:12px 0}.list-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:15px}.marker{width:28px;flex-shrink:0;text-align:right;direction:ltr;font-weight:bold}.list-row .paragraph{flex:1;min-width:0;margin:0}.image{margin:12px 0;text-align:center}.image img{display:block;width:100%;height:auto;margin:auto}.footnotes{border-top:1px solid #cbd5e1;padding-top:14px;margin-top:20px}.footnotes .paragraph{font-size:12px;line-height:1.7}.footnote{display:flex;gap:10px}.footnote .note-body{flex:1;min-width:0}.footnote .marker{font-size:12px;font-weight:normal}.sup{font-size:.7em;vertical-align:super;color:#335e83;direction:ltr;unicode-bidi:isolate}
.links{background:#edf6f0;padding:14px;margin-top:12px}.links button{display:block;background:transparent;border:0;text-decoration:underline;text-align:left;color:#235789;padding:4px 0}.issues{max-width:1260px;margin:16px auto;padding:16px;border-left:3px solid #c9971a;background:#fff9e6}.issues p{margin:6px 0}.hidden{display:none}#pace.paper{max-width:1000px;margin:24px auto}
@media(max-width:800px){header{padding:16px}.workspace{display:block;padding:12px}.list{max-height:210px;margin-bottom:16px}.paper-scroll{height:65vh;padding:4px}.paper{padding:18px}.paragraph{font-size:15px}.issues{margin:12px}}
</style></head><body>
<header><h1>Winter 5787 - Hafrashas Challah Part 1</h1><div class="pills"><span class="pill local">Local review only</span><span class="pill">45 notes chunks</span><span class="pill">21 Q&A</span><span class="pill">45 footnotes</span><span class="pill">4 pictures</span></div>
<nav><button data-category="notes" class="active">Review Notes</button><button data-category="qa">Q&A</button><button data-category="sources">Source Sheets</button><button data-category="pace">Pace</button><button id="issues-button">Import Notes</button><span class="pill">57 sources</span></nav></header>
<section id="issues" class="issues hidden"></section><div class="workspace" id="workspace"><aside><input id="search" placeholder="Search chunks" aria-label="Search chunks"><div class="sections" id="sections"></div><div class="list" id="list"></div></aside>
<main><div class="actions"><button id="previous">Previous</button><span class="meta" id="position"></span><button id="next">Next</button><button id="full">Full Document</button><button id="all-sections" class="hidden">All Sections</button></div><div class="actions hidden" id="selection-tools"><span id="selection-count"></span><button id="preview-selected">Preview Selected Sources</button><button id="clear-selected">Clear Selection</button></div><div class="paper-scroll" id="document"></div><div class="links" id="links"></div></main></div><div id="pace" class="paper hidden"></div>
<script id="preview-data" type="application/json">__PREVIEW_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('preview-data').textContent);
data.chunks=data.chunks.map(c=>{if(c.sourceType!=='qa')return c;const note=data.chunks.find(n=>n.code===c.relatedNotes?.[0]);return{...c,section:note?.section??'QA',sectionTitle:note?.sectionTitle??'Questions & Answers'}});
let category='notes',section='All',selectedCode='HC1-A1',whole=false;
const expanded=new Set(),chosen=new Set();let selectedPreview=false;
const byId=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isolateImportSpans(parts){
// Match across formatting runs so a bold initial remains attached to its Hebrew word.
const text=parts.map(p=>p.text).join(''),starts=new Set(),ends=new Set();
for(const match of text.matchAll(/[\u0590-\u05FF][\u0590-\u05FF"':.\-]*(?:[ \t]+[\u0590-\u05FF][\u0590-\u05FF"':.\-]*)*/g)){starts.add(match.index);ends.add(match.index+match[0].length)}
let offset=0;
return parts.map(part=>{let display='';for(let i=0;i<part.text.length;i++){if(starts.has(offset))display+='\u2067';display+=part.text[i];offset++;if(ends.has(offset))display+='\u2069'}return{...part,text:display}})
}
function spans(parts){return isolateImportSpans(parts??[]).map(s=>{let text=escapeHtml(s.text);if(s.bold)text='<strong>'+text+'</strong>';if(s.italic)text='<em>'+text+'</em>';if(s.underline)text='<u>'+text+'</u>';if(s.color)text='<span style="color:'+escapeHtml(s.color)+'">'+text+'</span>';if(s.footnote)text='<sup class="sup">'+text+'</sup>';if(s.href&&/^https?:\/\//i.test(s.href))text='<a href="'+escapeHtml(s.href)+'" target="_blank" rel="noopener noreferrer">'+text+'</a>';return text}).join('')}
function block(b){if(b.kind==='image')return '<div class="image"><img src="'+escapeHtml(b.uri)+'" alt="'+escapeHtml(b.alt)+'" style="max-width:'+b.displayWidth+'px"></div>';
let text=spans(b.spans),heading=b.kind==='heading';if(heading&&b.marker)text=escapeHtml(b.marker)+' '+text;
let p='<div class="paragraph '+(heading?'heading':'')+'" dir="'+(b.rtl?'rtl':'ltr')+'" style="text-align:'+(b.alignment??'left')+';'+(b.rtl?'direction:rtl;':'')+(!heading&&b.firstLine?'text-indent:'+b.firstLine+'px;':'')+'">'+text+'</div>';
if(b.kind==='list'||b.kind==='question')return '<div class="list-row" style="margin-left:'+(16+(b.level??0)*22)+'px"><span class="marker">'+escapeHtml(b.marker)+'</span>'+p+'</div>';
return '<div style="margin-left:'+Math.min(b.indent??0,48)+'px">'+p+'</div>'}
function paper(c){return '<article class="paper"><div class="meta">'+c.code+' - '+(c.sourceType==='sources'?'PDF page '+c.pdfPage:'Paragraphs '+c.paragraphStart+'-'+c.paragraphEnd)+'</div><h2>'+escapeHtml(c.title)+'</h2>'+c.blocks.map(block).join('')+(c.footnotes.length?'<section class="footnotes"><h3>Source Notes</h3>'+c.footnotes.map(n=>'<div class="footnote"><span class="marker">['+n.id+']</span><div class="note-body">'+n.blocks.map(block).join('')+'</div></div>').join('')+'</section>':'')+'</article>'}
function filtered(){const query=byId('search').value.trim().toLowerCase();return data.chunks.filter(c=>c.sourceType===category&&(section==='All'||c.section===section)&&(!query||(c.code+' '+c.title+' '+c.summary).toLowerCase().includes(query)))}
function select(code){selectedCode=code;whole=false;selectedPreview=false;const c=data.chunks.find(c=>c.code===code);if(c)expanded.add(c.sourceType+':'+c.section);render();byId('document').scrollTop=0}
function changeCategory(next){category=next;section='All';byId('search').value='';whole=false;selectedPreview=false;render();byId('document').scrollTop=0}
function toggleSources(codes){if(codes.every(code=>chosen.has(code)))codes.forEach(code=>chosen.delete(code));else codes.forEach(code=>chosen.add(code));render()}
function chunkButton(c,selected){return '<div style="display:flex;align-items:center">'+(category==='sources'?'<input style="width:20px;flex-shrink:0" type="checkbox" aria-label="Select '+escapeHtml(c.title)+'" data-choose="'+c.code+'" '+(chosen.has(c.code)?'checked':'')+'>':'')+'<button class="chunk '+(c===selected?'selected':'')+'" data-code="'+c.code+'"><span class="meta">'+c.code+(c.officialShiur?' - Shiur '+c.officialShiur:'')+'</span><strong>'+escapeHtml(c.title)+'</strong><span class="meta">'+(category==='sources'?c.relatedNotes.length+' linked notes':c.footnotes.length+' footnotes'+(c.relatedQa?.length?' - '+c.relatedQa.length+' Q&A':''))+'</span></button></div>'}
function render(){document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('active',b.dataset.category===category));byId('workspace').classList.toggle('hidden',category==='pace');byId('pace').classList.toggle('hidden',category!=='pace');if(category==='pace'){byId('pace').innerHTML=data.pace.map(block).join('');return}
byId('sections').innerHTML=category==='notes'?['All','A','B','C','D','E','F','G'].map(s=>'<button class="'+(s===section?'active':'')+'" data-section="'+s+'">'+s+'</button>').join(''):'';
byId('sections').querySelectorAll('button').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});
const visible=filtered(),selected=visible.find(c=>c.code===selectedCode)??visible[0],index=visible.indexOf(selected);
byId('list').innerHTML=[...new Set(visible.map(c=>c.section))].map(key=>{
const group=visible.filter(c=>c.section===key),title=group[0].sectionTitle.replace(/^[A-G]\.\s*/,''),label=key==='P2'?'Part 2 - Unlinked':key==='QA'?title:'Section '+key+' - '+title,folderKey=category+':'+key,noun=category==='sources'?'source':category==='qa'?'question':'chunk';
return '<section style="border-bottom:1px solid #d7dfe5;padding:8px 0"><button style="width:100%;text-align:left" aria-expanded="'+expanded.has(folderKey)+'" data-expand="'+folderKey+'">'+(expanded.has(folderKey)?'&#9662;':'&#9656;')+' '+escapeHtml(label)+'</button><div class="meta">'+group.length+' '+noun+(group.length===1?'':'s')+(category==='sources'?' - '+group.filter(c=>chosen.has(c.code)).length+' selected':'')+'</div><div class="actions"><button data-view-section="'+key+'">View Section</button>'+(category==='sources'?'<button data-select-section="'+key+'">'+(group.every(c=>chosen.has(c.code))?'Deselect Section':'Select Section')+'</button>':'')+'</div>'+(expanded.has(folderKey)?group.map(c=>chunkButton(c,selected)).join(''):'')+'</section>'}).join('');
byId('list').querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>select(b.dataset.code));
byId('list').querySelectorAll('[data-choose]').forEach(b=>b.onchange=()=>toggleSources([b.dataset.choose]));
byId('list').querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{const key=b.dataset.expand;if(expanded.has(key))expanded.delete(key);else expanded.add(key);render()});
byId('list').querySelectorAll('[data-view-section]').forEach(b=>b.onclick=()=>{section=b.dataset.viewSection;whole=true;selectedPreview=false;render();byId('document').scrollTop=0});
byId('list').querySelectorAll('[data-select-section]').forEach(b=>b.onclick=()=>toggleSources(visible.filter(c=>c.section===b.dataset.selectSection).map(c=>c.code)));
const preview=selectedPreview?data.chunks.filter(c=>c.sourceType==='sources'&&chosen.has(c.code)):whole?visible:selected?[selected]:[];
byId('document').innerHTML=(whole&&category!=='sources'&&section==='All'?'<div class="paper">'+block(category==='notes'?data.notesDocumentTitle:data.qaDocumentTitle)+'</div>':'')+preview.map(paper).join('');byId('position').textContent=visible.length?(index+1)+' of '+visible.length:'No matching chunks';
byId('selection-tools').classList.toggle('hidden',category!=='sources');byId('selection-count').textContent=chosen.size+' selected';byId('preview-selected').disabled=!chosen.size;byId('clear-selected').disabled=!chosen.size;byId('all-sections').classList.toggle('hidden',section==='All');
byId('previous').disabled=index<=0||whole||selectedPreview;byId('next').disabled=index<0||index===visible.length-1||whole||selectedPreview;byId('previous').onclick=()=>select(visible[index-1].code);byId('next').onclick=()=>select(visible[index+1].code);byId('full').textContent=whole||selectedPreview?'Single Chunk':'Full Document';
const groups=category==='notes'?[{title:'Suggested Q&A',codes:selected?.relatedQa??[]},{title:'Suggested Source Sheets',codes:selected?.relatedSources??[]}]:[{title:'Related Review Notes',codes:selected?.relatedNotes??[]}];
byId('links').classList.toggle('hidden',!selected||whole||selectedPreview);byId('links').innerHTML=groups.map(group=>'<h3>'+group.title+'</h3>'+group.codes.map(code=>data.chunks.find(c=>c.code===code)).filter(Boolean).map(c=>'<button data-link="'+c.code+'">'+c.code+' - '+escapeHtml(c.title)+'</button>').join('')+(!group.codes.length?'<p class="meta">'+(selected?.code==='HC1-S57'?'Part 2 source - intentionally unlinked.':'No linked material.')+'</p>':'')).join('')+(selected?.sourceNumbers.length?'<p class="meta">Source references: '+selected.sourceNumbers.join(', ')+'</p>':'');byId('links').querySelectorAll('button').forEach(b=>b.onclick=()=>{const c=data.chunks.find(c=>c.code===b.dataset.link);expanded.add(c.sourceType+':'+c.section);changeCategory(c.sourceType);select(c.code)})}
byId('issues').innerHTML=data.corrections.concat(data.warnings).map(t=>'<p>'+escapeHtml(t)+'</p>').join('');byId('issues-button').onclick=()=>byId('issues').classList.toggle('hidden');byId('search').oninput=render;byId('full').onclick=()=>{whole=!whole&&!selectedPreview;selectedPreview=false;render();byId('document').scrollTop=0};byId('all-sections').onclick=()=>{section='All';whole=false;render()};byId('preview-selected').onclick=()=>{selectedPreview=true;whole=false;render();byId('document').scrollTop=0};byId('clear-selected').onclick=()=>{chosen.clear();selectedPreview=false;render()};document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>changeCategory(b.dataset.category));render();
</script></body></html>
